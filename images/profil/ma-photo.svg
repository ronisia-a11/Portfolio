<!-- Avatar Professionnel Placeholder -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="15 10" opacity="0.6"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Character / Developer silhouette / Avatar -->
  <g transform="translate(0, 20)">
    <!-- Body / Shoulders -->
    <path d="M 120 440 C 130 350, 180 320, 250 320 C 320 320, 370 350, 380 440 Z" fill="url(#primaryGrad)"/>
    <!-- Collar / Shirt Detail -->
    <path d="M 215 320 L 250 365 L 285 320 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 235 320 L 250 390 L 265 320 Z" fill="#93c5fd"/>
    
    <!-- Neck -->
    <rect x="225" y="250" width="50" height="80" rx="10" fill="#fbcfe8"/>
    
    <!-- Head -->
    <ellipse cx="250" cy="210" rx="70" ry="85" fill="#fed7aa"/>
    
    <!-- Hair (Modern cut) -->
    <path d="M 175 190 C 170 120, 210 110, 250 110 C 290 110, 330 120, 325 190 C 315 160, 290 145, 250 145 C 205 145, 185 165, 175 190 Z" fill="#1e1b4b"/>
    
    <!-- Glasses (Tech look) -->
    <rect x="195" y="195" width="45" height="30" rx="8" fill="none" stroke="#3b82f6" stroke-width="6"/>
    <rect x="260" y="195" width="45" height="30" rx="8" fill="none" stroke="#3b82f6" stroke-width="6"/>
    <line x1="240" y1="210" x2="260" y2="210" stroke="#3b82f6" stroke-width="6"/>
    
    <!-- Smile -->
    <path d="M 230 255 Q 250 270 270 255" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tech badge floating -->
  <g transform="translate(340, 340)">
    <circle cx="40" cy="40" r="38" fill="#0f172a" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>
    <text x="40" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#10b981" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
